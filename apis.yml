  detail: 'Takeda runs large internal API platforms - AWS AppSync GraphQL for its data scientists, a PingFederate
    workforce IdP that robots.txt disallows - but exposes none of it outward: developer.takeda.com and
    api.takeda.com do not resolve at all, the corporate site 404s every well-known path, and the only
    supplier integration Takeda names is a third-party Apex Analytix payments portal, so there is no developer
    programme to gate or to read.'
