aid: takeda-pharmaceutical-company
name: Takeda Pharmaceutical Company
description: 'Takeda Pharmaceutical Company Limited is a Japanese multinational biopharmaceutical company
  headquartered in Tokyo, founded in 1781 and listed on the Tokyo Stock Exchange (4502) and the New York
  Stock Exchange (TAK). It is the largest pharmaceutical company in Japan and Asia, and operates globally
  across oncology, rare genetic and hematologic diseases, neuroscience, gastroenterology, plasma-derived
  therapies and vaccines, a portfolio substantially expanded by its 2019 acquisition of Shire. Takeda
  is a software consumer rather than a software vendor: it runs large internal API and data platforms,
  but publishes no public developer program, API reference or machine-readable contract. The one machine-readable
  document it does serve to automated clients is an llms.txt at its corporate root, which indexes its
  verified country websites and states an explicit LLM usage and attribution policy.'
